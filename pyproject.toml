# Only tool settings: the skill itself needs no installation.
[tool.ruff]
target-version = "py39"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105", "SIM108", "SIM905", "UP031"]

[tool.ruff.lint.per-file-ignores]
# The version check must run before anything newer is imported.
"skills/novelty-check/scripts/papers.py" = ["UP036"]

[tool.ruff.lint.isort]
known-first-party = ["novelty_check"]
